model:
  activation_checkpointing: true

training:
  steps: 24000
  gradient_accumulation: 15
  peak_learning_rate: 0.0002
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  seed: 20260811
  log_every: 10
  save_every: 1000
  validation_every: 1000
  validation_batches: 64
  early_stopping_patience: 5

data:
  microbatch_per_gpu: 1
  num_workers: 0
  tuh_sampling_cap: 0.4
  sample_rate_hz: 200
  window_seconds: 30
  patch_seconds: 1
  mask_ratio: 0.5
  mask_mixture: [0.4, 0.2, 0.2, 0.2]

